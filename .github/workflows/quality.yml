name: Quality

on:
  push:
    branches: [master]
  pull_request:
  # Full-catalog regression: nightly, and on demand from the Actions tab.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Render every episode (otherwise only changes since the previous commit)
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.select.outputs.episodes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change can be diffed against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Global checks always run: they're fast and cover every episode.
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - id: select
        name: Choose episodes to render
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL_INPUT" = "true" ]; }; then
            args="--full"
          elif [ "$EVENT" = "pull_request" ]; then
            args="--base=origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            args="--base=$BEFORE"
          else
            args="--base=HEAD~1"
          fi
          echo "episodes=$(node scripts/select-episodes.mjs $args)" >> "$GITHUB_OUTPUT"

  render-episodes:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.episodes != '[]'
    strategy:
      fail-fast: false
      matrix:
        episode: ${{ fromJSON(needs.validate.outputs.episodes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for render QA
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run video -- ${{ matrix.episode }}
      - run: npm run sheet -- ${{ matrix.episode }}
      - run: npm run still -- ${{ matrix.episode }}
      - run: npm run description -- ${{ matrix.episode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.episode }}
          path: |
            out/${{ matrix.episode }}.mp4
            out/${{ matrix.episode }}-contact-sheet.png
            out/${{ matrix.episode }}-cover.png
            out/${{ matrix.episode }}-description.txt
          if-no-files-found: warn
