name: Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.catalog.outputs.episodes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - id: catalog
        name: Build episode matrix
        run: echo "episodes=$(node scripts/list-episode-ids.mjs --json)" >> "$GITHUB_OUTPUT"

  render-episodes:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        episode: ${{ fromJSON(needs.validate.outputs.episodes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for render QA
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run video -- ${{ matrix.episode }}
      - run: npm run still -- ${{ matrix.episode }}
      - run: npm run description -- ${{ matrix.episode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.episode }}
          path: |
            out/${{ matrix.episode }}.mp4
            out/${{ matrix.episode }}-cover.png
            out/${{ matrix.episode }}-description.txt
          if-no-files-found: warn
