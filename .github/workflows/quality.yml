name: Quality

on:
  push:
    branches: [master]
  pull_request:
    # labeled: re-run when a PR is marked pokepulses-visual-change.
    types: [opened, synchronize, reopened, labeled]
  # Full-catalog regression: nightly, and on demand from the Actions tab.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Render every episode (otherwise only changes since the previous commit)
        type: boolean
        default: true

# A new push to a PR cancels that PR's run still in progress; master and nightly runs always finish.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.select.outputs.episodes }}
      frames: ${{ steps.select.outputs.frames }}
      geo: ${{ steps.select.outputs.geo }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change can be diffed against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Global checks always run: they're fast and cover every episode.
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run geo:verify
      - id: select
        name: Choose episodes to render
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL_INPUT" = "true" ]; }; then
            args="--full"
          elif [ "$EVENT" = "pull_request" ]; then
            args="--base=origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            args="--base=$BEFORE"
          else
            args="--base=HEAD~1"
          fi
          node scripts/select-episodes.mjs $args >> "$GITHUB_OUTPUT"

  # Shared-code changes: render only the frames the video critic reads (one per
  # scene, plus the cover) for the whole golden set, in one job and one browser.
  frame-check:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.frames != ''
    steps:
      - uses: actions/checkout@v4
        with:
          # The visual review renders the base branch too.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Remotion downloads Chrome Headless Shell into node_modules/.remotion on first use; keep it between runs.
      - name: Cache the Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install FFmpeg and Tesseract for render QA
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr
      - name: Review frames, contact sheet, description and video critic
        env:
          EPISODES: ${{ needs.validate.outputs.frames }}
          VIDEO_CRITIC_VISION: ${{ vars.VIDEO_CRITIC_VISION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm run frames -- $EPISODES
          failed=""
          for id in $EPISODES; do
            echo "::group::$id"
            npm run sheet -- "$id" --frames
            npm run description -- "$id"
            npm run critic:video -- "$id" --frames || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Video critic found blocking issues in:$failed"; exit 1; fi
      # PokePulses must look exactly as before unless the PR is labelled as an intended change.
      # The before/after page (out/visual-review/index.html) is uploaded for approval either way.
      # The working tree's frames come from the step above (CI has no generated narration, so they
      # match a --voice=none render); scene-change strips only when map rendering may have changed.
      - name: Visual review against the base branch
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'pokepulses-visual-change') && '--allow-change' || '' }}
          STRIPS: ${{ needs.validate.outputs.geo != 'true' && '--no-strips' || '' }}
        run: npm run review:visual -- --base=origin/$BASE_REF --reuse-head $ALLOW $STRIPS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-check
          path: |
            out/*-frames/*.png
            out/*-contact-sheet.png
            out/*-cover.png
            out/*-description.txt
            out/*-video-review.json
            out/visual-review/index.html
          if-no-files-found: warn

  # GeoMotion: render the map golden shots and compare them with test/golden/geo/.
  geo-golden:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.geo == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Remotion downloads Chrome Headless Shell into node_modules/.remotion on first use; keep it between runs.
      - name: Cache the Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install FFmpeg for frame comparison
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm run geo:golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-golden
          path: out/geo-golden/*.png
          if-no-files-found: warn

  # Full MP4s: episodes whose own files changed, one audio/encoding smoke test,
  # and every episode nightly.
  render-episodes:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.episodes != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Each entry is one or more space-separated episode ids; large catalogs
        # are spread over at most 64 jobs (GitHub caps a matrix at 256).
        shard: ${{ fromJSON(needs.validate.outputs.episodes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Remotion downloads Chrome Headless Shell into node_modules/.remotion on first use; keep it between runs.
      - name: Cache the Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install FFmpeg and Tesseract for render QA
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr
      - name: Render, contact sheet, cover, description and video critic
        env:
          SHARD: ${{ matrix.shard }}
          # The vision critic is opt-in (repository variable VIDEO_CRITIC_VISION=1) and uses a model key secret.
          VIDEO_CRITIC_VISION: ${{ vars.VIDEO_CRITIC_VISION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          failed=""
          for id in $SHARD; do
            echo "::group::$id"
            # The validate job already checked every manifest, so the render skips its own validation.
            STUDIO_CHECKED="$id" npm run video -- "$id"
            npm run sheet -- "$id"
            npm run still -- "$id"
            npm run description -- "$id"
            # Review every episode in the shard before failing, so one report covers them all.
            npm run critic:video -- "$id" || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Video critic found blocking issues in:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ strategy.job-index }}
          path: |
            out/*.mp4
            out/*-contact-sheet.png
            out/*-cover.png
            out/*-description.txt
            out/*-video-review.json
          if-no-files-found: warn
